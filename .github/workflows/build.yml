name: build

# Builds and uploads the Mochi Android app APK.
#
# Produces an installable debug APK and an unsigned release APK, and uploads
# both as workflow artifacts so you can grab an APK from the Actions tab.
#
# The fallback GitHub token for the MochiiAI service account is provided
# through the `MOCHI_DEFAULT_GITHUB_TOKEN` secret (optional) and forwarded as
# the `mochiDefaultGitHubToken` Gradle property. When absent the build proceeds
# with an empty fallback — users add their own PAT in-app.

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Assemble APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
        env:
          ORG_GRADLE_PROJECT_mochiDefaultGitHubToken: ${{ secrets.MOCHI_DEFAULT_GITHUB_TOKEN }}

      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          ORG_GRADLE_PROJECT_mochiDefaultGitHubToken: ${{ secrets.MOCHI_DEFAULT_GITHUB_TOKEN }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mochi-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mochi-app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mochi-build-logs
          path: |
            android/app/build/reports/
          if-no-files-found: ignore